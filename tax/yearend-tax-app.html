<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연말정산 AI 튜터 &amp; ERP 시뮬레이터</title>

<!-- ============================================================
  설정 가이드 (배포 전 필독)
  1) FIREBASE_CONFIG 를 본인 Firebase 프로젝트 설정값으로 교체하세요.
  2) CHAT_ENDPOINT 를 Firebase Functions 배포 URL로 교체하세요.
     (동봉된 functions/index.js 참고 — Anthropic API 키를 서버(Functions)에서만
      사용하도록 만든 프록시입니다. 절대 API 키를 이 HTML 파일에 직접 넣지 마세요.)
  3) 세율·공제 한도는 교육용으로 단순화한 값입니다. 실제 세법 개정사항을
     매년 학기 초에 확인하여 TAX_RULES 객체를 갱신하세요.
============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

<style>
  :root{
    --navy:#122A52;
    --navy-light:#1F3E70;
    --gold:#C9A227;
    --gold-light:#EFE1B0;
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --ink:#1B2333;
    --muted:#697086;
    --line:#E4E7EF;
    --good:#1E7A46;
    --bad:#B3261E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);
  }
  #app{max-width:1080px;margin:0 auto;padding:0 16px 60px;}

  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
    color:#fff;padding:22px 20px;border-radius:0 0 20px 20px;margin-bottom:18px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  header.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-0.3px;}
  header.top .sub{font-size:12.5px;color:var(--gold-light);margin-top:4px;}
  header.top .user-badge{
    background:rgba(255,255,255,0.12);padding:8px 14px;border-radius:999px;font-size:13px;
    display:flex;align-items:center;gap:8px;
  }
  header.top .user-badge button{
    background:none;border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:999px;
    padding:3px 10px;font-size:11px;cursor:pointer;
  }

  /* ---- 로그인 ---- */
  #loginScreen{
    max-width:420px;margin:60px auto;background:var(--card);border-radius:var(--radius);
    padding:36px 30px;box-shadow:0 10px 30px rgba(18,42,82,0.08);text-align:center;
  }
  #loginScreen h2{color:var(--navy);margin-top:0;}
  #loginScreen p.desc{color:var(--muted);font-size:13.5px;line-height:1.6;}
  #loginScreen input{
    width:100%;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);
    border-radius:10px;font-size:15px;
  }
  #loginScreen select{
    width:100%;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);
    border-radius:10px;font-size:15px;background:#fff;
  }
  .btn-primary{
    width:100%;padding:13px;margin-top:10px;background:var(--navy);color:#fff;
    border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn-primary:hover{background:var(--navy-light);}
  #loginMsg{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:6px;}

  /* ---- 탭 ---- */
  nav.tabs{
    display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;
  }
  nav.tabs button{
    flex:0 0 auto;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;
    white-space:nowrap;
  }
  nav.tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .card{
    background:var(--card);border-radius:var(--radius);padding:22px;margin-bottom:16px;
    box-shadow:0 2px 10px rgba(18,42,82,0.05);border:1px solid var(--line);
  }
  .card h2{margin-top:0;color:var(--navy);font-size:18px;}
  .card h3{color:var(--navy-light);font-size:15px;margin-bottom:6px;}
  .hint{background:var(--gold-light);color:#5c4a06;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;}

  /* ---- 퀴즈 ---- */
  .quiz-q{padding:16px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;}
  .quiz-q p.qtext{font-weight:700;margin:0 0 10px;}
  .quiz-opt{
    display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;
    border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13.5px;
  }
  .quiz-opt.correct{border-color:var(--good);background:#EAF6EE;}
  .quiz-opt.wrong{border-color:var(--bad);background:#FBEAEA;}
  .quiz-explain{font-size:12.5px;color:var(--muted);margin-top:8px;display:none;}

  /* ---- 급여명세서 ---- */
  .payslip-item{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;
  }
  .payslip-item .amt{color:var(--muted);font-size:13px;}
  .payslip-item .choices button{
    padding:6px 12px;margin-left:6px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;cursor:pointer;font-size:12.5px;
  }
  .payslip-item .choices button.selected-tax{background:#FBEAEA;border-color:var(--bad);}
  .payslip-item .choices button.selected-free{background:#EAF6EE;border-color:var(--good);}

  /* ---- ERP 시뮬레이터 ---- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
  .form-field label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px;}
  .form-field input, .form-field select{
    width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;
  }
  .result-box{
    margin-top:18px;padding:18px;border-radius:12px;background:var(--navy);color:#fff;
  }
  .result-box .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,0.15);}
  .result-box .row:last-child{border-bottom:none;}
  .result-box .final{font-size:17px;font-weight:800;color:var(--gold);}

  /* ---- 실무 흐름 위저드 ---- */
  .step-indicator{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;}
  .step-dot{
    flex:1;min-width:80px;text-align:center;padding:8px 4px;border-radius:8px;font-size:11px;
    background:#F0F1F5;color:var(--muted);font-weight:700;border:1.5px solid transparent;
  }
  .step-dot.active{background:var(--navy);color:#fff;}
  .step-dot.done{background:var(--gold-light);color:#5c4a06;border-color:var(--gold);}
  .mock-browser{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
  .mock-browser .bar{
    background:#E8EAF0;padding:8px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;
  }
  .mock-browser .bar .dot{width:8px;height:8px;border-radius:50%;background:#C7CBD6;display:inline-block;}
  .mock-browser .content{padding:16px;background:#fff;}
  .mock-browser.hometax .bar{background:#0B3D91;color:#fff;}
  .mock-browser.erp .bar{background:var(--navy);color:#fff;}
  .provider-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
    border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:13px;
  }
  .provider-row .status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#F0F1F5;color:var(--muted);}
  .provider-row.loaded .status{background:#EAF6EE;color:var(--good);}
  .dep-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .dep-row input{flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;}
  .dep-row button{border:none;background:#FBEAEA;color:var(--bad);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px;}
  .payroll-card{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;}
  .payroll-card .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .certificate{
    border:2px solid var(--navy);border-radius:12px;padding:24px;text-align:center;background:#fff;
  }
  .certificate h3{color:var(--navy);margin-bottom:4px;}
  .certificate .stamp{
    display:inline-block;margin-top:14px;padding:6px 16px;border:2px solid var(--bad);color:var(--bad);
    border-radius:8px;font-weight:800;transform:rotate(-8deg);font-size:13px;
  }
  .wizard-nav{display:flex;justify-content:space-between;margin-top:18px;}
  .btn-secondary{
    padding:11px 18px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
    font-weight:700;cursor:pointer;font-size:13.5px;
  }

  /* ---- RPA ---- */
  .rpa-flow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .rpa-step-chip{
    flex:1;min-width:130px;background:#F5F6FA;border:1.5px solid var(--line);border-radius:10px;
    padding:12px;font-size:12.5px;text-align:center;position:relative;
  }
  .rpa-step-chip .n{
    width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px;
  }
  .rpa-step-chip.running{border-color:var(--gold);background:var(--gold-light);}
  .rpa-step-chip.done .n{background:var(--good);}
  #rpaConsole{
    background:#0B1220;color:#8FE3A6;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;
    border-radius:12px;padding:14px;height:180px;overflow-y:auto;margin-bottom:14px;line-height:1.7;
  }
  #rpaConsole .line-dim{color:#5C6B7A;}
  .progress-bar{height:8px;background:#E4E7EF;border-radius:999px;overflow:hidden;margin-bottom:14px;}
  .progress-bar .fill{height:100%;background:var(--gold);width:0%;transition:width 0.3s;}
  table.batch-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.batch-table th{text-align:left;padding:6px;border-bottom:2px solid var(--navy);}
  table.batch-table td{padding:6px;border-bottom:1px solid var(--line);}

  /* ---- BI ---- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  @media(max-width:640px){.kpi-grid{grid-template-columns:1fr 1fr;}}
  .kpi-card{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .kpi-card .v{font-size:19px;font-weight:800;color:var(--navy);}
  .kpi-card .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:720px){.chart-grid{grid-template-columns:1fr;}}
  .chart-box{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;}
  .chart-box h3{margin-top:0;}

  /* ---- AI 튜터 ---- */
  #chatBox{
    height:360px;overflow-y:auto;border:1.5px solid var(--line);border-radius:12px;
    padding:14px;background:#FAFBFD;margin-bottom:10px;
  }
  .msg{max-width:80%;padding:10px 13px;border-radius:12px;margin-bottom:10px;font-size:13.5px;line-height:1.55;}
  .msg.bot{background:#fff;border:1.5px solid var(--line);}
  .msg.user{background:var(--navy);color:#fff;margin-left:auto;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{
    flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;
  }
  .chat-input-row button{
    padding:0 20px;border-radius:999px;border:none;background:var(--navy);color:#fff;cursor:pointer;font-weight:700;
  }

  textarea.report{
    width:100%;min-height:140px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;
  }

  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge.done{background:#EAF6EE;color:var(--good);}
  .badge.todo{background:#F0F1F5;color:var(--muted);}

  #teacherToggle{
    position:fixed;bottom:16px;right:16px;background:var(--navy);color:#fff;border:none;
    border-radius:999px;padding:10px 16px;font-size:12px;cursor:pointer;opacity:0.85;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 로그인 화면 -->
  <div id="loginScreen">
    <h2>연말정산 AI 튜터</h2>
    <p class="desc">생성형 AI ERP 시뮬레이터와 함께 연말정산 실무를 배워봅시다.<br>이름과 학급 PIN을 입력해 주세요.</p>
    <select id="loginClass"></select>
    <input id="loginName" type="text" placeholder="이름 (예: 홍길동)">
    <input id="loginPin" type="text" placeholder="학급 PIN (선생님께 확인)">
    <button class="btn-primary" onclick="doLogin()">시작하기</button>
    <div id="loginMsg"></div>
  </div>

  <!-- 메인 화면 -->
  <div id="mainScreen" style="display:none;">
    <header class="top">
      <div>
        <h1>연말정산 AI 튜터 &amp; ERP 시뮬레이터</h1>
        <div class="sub">상업과 융합수업 · 생성형 AI 기반 실무 체험</div>
      </div>
      <div class="user-badge">
        <span id="userLabel"></span>
        <button onclick="logout()">로그아웃</button>
      </div>
    </header>

    <nav class="tabs">
      <button data-tab="concept" onclick="showTab('concept')">① 개념 퀴즈</button>
      <button data-tab="payslip" onclick="showTab('payslip')">② 급여명세서 판정</button>
      <button data-tab="erp" onclick="showTab('erp')">③ 연말정산 실무 처리</button>
      <button data-tab="chat" onclick="showTab('chat')">④ AI 튜터</button>
      <button data-tab="project" onclick="showTab('project')">⑤ 종합 프로젝트</button>
      <button data-tab="rpa" onclick="showTab('rpa')">⑥ RPA 자동화</button>
      <button data-tab="bi" onclick="showTab('bi')">⑦ BI 대시보드</button>
    </nav>

    <div id="tab-concept" class="tabpanel"></div>
    <div id="tab-payslip" class="tabpanel" style="display:none;"></div>
    <div id="tab-erp" class="tabpanel" style="display:none;"></div>
    <div id="tab-chat" class="tabpanel" style="display:none;"></div>
    <div id="tab-project" class="tabpanel" style="display:none;"></div>
    <div id="tab-rpa" class="tabpanel" style="display:none;"></div>
    <div id="tab-bi" class="tabpanel" style="display:none;"></div>
  </div>

  <!-- 교사 대시보드 -->
  <div id="teacherScreen" style="display:none;"></div>
  <button id="teacherToggle" onclick="openTeacher()">교사 대시보드</button>
</div>

<script>
/* =========================================================
   0. 설정
========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDLEHF5jWor457zWYXL57jOkcJcPJsQfNU",
  authDomain: "accounting-960b5.firebaseapp.com",
  projectId: "accounting-960b5",
  storageBucket: "accounting-960b5.firebasestorage.app",
  messagingSenderId: "753390768491",
  appId: "1:753390768491:web:634a3562a526d7571c3c2e",
  measurementId: "G-8ZKYP7R3V4"
};
const CHAT_ENDPOINT = "https://REGION-YOUR_PROJECT.cloudfunctions.net/yearEndTaxTutor";
const TEACHER_PASSWORD = "changeme"; // 배포 전 반드시 변경

const CLASSES = ["1반","2반","3반","4반","5반","6반","7반","8반","9반","10반"];
const CLASS_PINS = { "1반":"1101","2반":"1102","3반":"1103","4반":"1104","5반":"1105","6반":"1106","7반":"1107","8반":"1108","9반":"1109","10반":"1110" }; // 최초 배포 시 기본값 (Firestore에 아직 저장된 값이 없을 때만 사용됨)
let CLASS_PIN_MAP = null; // 실제 사용되는 PIN. Firestore(settings/classPins)에서 불러오며, 교사 대시보드에서 수정 가능

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

let CURRENT = null; // {name, cls, id}

async function loadClassPins(){
  try{
    const doc = await db.collection('settings').doc('classPins').get();
    CLASS_PIN_MAP = doc.exists ? { ...CLASS_PINS, ...doc.data() } : { ...CLASS_PINS };
  }catch(e){
    CLASS_PIN_MAP = { ...CLASS_PINS };
    console.warn('PIN 설정을 Firestore에서 불러오지 못해 기본값을 사용합니다:', e);
  }
}
loadClassPins();

/* =========================================================
   1. 로그인 / 로그아웃
========================================================= */
(function initClassSelect(){
  const sel = document.getElementById('loginClass');
  CLASSES.forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
  });
})();

async function doLogin(){
  const cls = document.getElementById('loginClass').value;
  const name = document.getElementById('loginName').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!name){ msg.textContent="이름을 입력해 주세요."; return; }
  if(!CLASS_PIN_MAP){ await loadClassPins(); } // 아직 로딩 전이면 한 번 더 시도
  const correctPin = CLASS_PIN_MAP[cls];
  if(pin !== correctPin){ msg.textContent="PIN이 일치하지 않습니다. 선생님께 확인해 주세요."; return; }

  const id = `${cls}_${name}`;
  CURRENT = { name, cls, id };
  sessionStorage.setItem('yetax_user', JSON.stringify(CURRENT));

  try{
    await db.collection('students').doc(id).set({
      name, cls, lastLogin: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
  }catch(e){ console.warn('Firestore 저장 실패(설정을 확인하세요):', e); }

  enterApp();
}

function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainScreen').style.display='block';
  document.getElementById('userLabel').textContent = `${CURRENT.cls} · ${CURRENT.name}`;
  showTab('concept');
}

function logout(){
  sessionStorage.removeItem('yetax_user');
  CURRENT = null;
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('loginScreen').style.display='block';
}

window.addEventListener('DOMContentLoaded', ()=>{
  const saved = sessionStorage.getItem('yetax_user');
  if(saved){ CURRENT = JSON.parse(saved); enterApp(); }
});

/* =========================================================
   2. 탭 전환
========================================================= */
const RENDERED = {};
function showTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tabpanel').forEach(p=>p.style.display='none');
  const panel = document.getElementById('tab-'+name);
  panel.style.display='block';
  if(!RENDERED[name]){
    ({concept:renderConcept, payslip:renderPayslip, erp:renderErp, chat:renderChat, project:renderProject, rpa:renderRpa, bi:renderBi})[name]();
    RENDERED[name]=true;
  }
}

/* =========================================================
   3. ① 개념 퀴즈
========================================================= */
const QUIZ = [
  { q:"근로소득 연말정산에서 '소득공제'와 '세액공제'의 차이로 옳은 것은?",
    opts:["소득공제는 과세표준을 줄이고, 세액공제는 산출된 세금 자체를 줄인다.",
          "소득공제는 세금 자체를 줄이고, 세액공제는 과세표준을 줄인다.",
          "둘 다 세율을 직접 낮추는 제도이다.",

  const el = document.getElementById('tab-concept');
  let html = `<div class="card"><h2>① 연말정산 개념 퀴즈</h2>

  QUIZ.forEach((item,qi)=>{
    html += `<div class="quiz-q" id="q${qi}">
      <p class="qtext">${qi+1}. ${item.q}</p>
      ${item.opts.map((o,oi)=>`<button class="quiz-opt" onclick="answerQuiz(${qi},${oi})">${o}</button>`).join('')}
      <p class="quiz-explain" id="exp${qi}">✅ ${item.explain}</p>
    </div>`;
  });
  html += `<div id="quizScore" style="font-weight:700;color:var(--navy);margin-top:10px;"></div></div>`;

let quizAnswered = {};
function answerQuiz(qi, oi){
  if(quizAnswered[qi]!==undefined) return;
  quizAnswered[qi]=oi;
  const item = QUIZ[qi];
  const buttons = document.querySelectorAll(`#q${qi} .quiz-opt`);
  buttons.forEach((b,i)=>{
    b.disabled = true;
    if(i===item.correct) b.classList.add('correct');
    else if(i===oi) b.classList.add('wrong');
  });
  document.getElementById(`exp${qi}`).style.display='block';
  const answeredCount = Object.keys(quizAnswered).length;
  if(answeredCount===QUIZ.length){
    const correctCount = Object.entries(quizAnswered).filter(([k,v])=>QUIZ[k].correct===v).length;
    document.getElementById('quizScore').textContent = `퀴즈 완료! ${QUIZ.length}문제 중 ${correctCount}개 정답`;
    saveProgress('concept', { score: correctCount, total: QUIZ.length });
  }
}

let payslipAnswered = {};
function answerPayslip(i, guessTaxable){
  if(payslipAnswered[i]!==undefined) return;
  payslipAnswered[i]=guessTaxable;
  const item = PAYSLIP[i];
  const row = document.getElementById(`p${i}`);
  const btns = row.querySelectorAll('button');
  btns.forEach(b=>b.disabled=true);

  row.style.borderColor = correct ? 'var(--good)' : 'var(--bad)';
  if(!correct || item.note){
    const noteEl = document.createElement('div');

    noteEl.textContent = `정답: ${item.taxable?'과세':'비과세'}${item.note? ' · '+item.note:''}`;

  const answeredCount = Object.keys(payslipAnswered).length;

    document.getElementById('payslipResult').textContent = `판정 완료! ${PAYSLIP.length}개 중 ${correctCount}개 정답`;

async function sendChat(){

  addChatMsg('user', text);
  chatHistory.push({role:'user', content:text});

  const box = document.getElementById('chatBox');

function calcYearEndTax({salary,family,insurance,card,medical,edu,pension,prepaid}){
  const r = TAX_RULES;
  let earnedIncomeDeduction;
  if(salary<=5000000) earnedIncomeDeduction = salary*0.7;
  else if(salary<=15000000) earnedIncomeDeduction = 3500000 + (salary-5000000)*0.4;
  else if(salary<=45000000) earnedIncomeDeduction = 7500000 + (salary-15000000)*0.15;
  else if(salary<=100000000) earnedIncomeDeduction = 12000000 + (salary-45000000)*0.05;
  else earnedIncomeDeduction = 14750000 + (salary-100000000)*0.02;
  const earnedIncomeAmount = Math.max(salary - earnedIncomeDeduction, 0);

  const personalDeduction = family * r.personalDeduction;
  const cardFloor = salary * r.cardFloorRate;
  const cardDeductible = Math.max(card - cardFloor, 0) * r.cardDeductionRate;
  const totalIncomeDeduction = personalDeduction + insurance + cardDeductible;

  const taxBase = Math.max(earnedIncomeAmount - totalIncomeDeduction, 0);
  const bracket = r.brackets.find(b=>taxBase<=b.upto);
  const calculatedTax = Math.max(taxBase*bracket.rate - bracket.deduct, 0);

  const medicalCredit = Math.max(medical - salary*r.medicalThresholdRate, 0) * r.medicalCreditRate;
  const eduCredit = edu * r.eduCreditRate;
  const pensionCredit = Math.min(pension,6000000) * r.pensionCreditRate;
  const earnedIncomeCredit = Math.min(calculatedTax*0.55, r.earnedIncomeCreditCap);
  const totalCredit = medicalCredit + eduCredit + pensionCredit + earnedIncomeCredit;

  const finalTax = Math.max(Math.round(calculatedTax - totalCredit), 0);
  const diff = prepaid - finalTax;
  return { earnedIncomeAmount, totalIncomeDeduction, taxBase, calculatedTax, totalCredit, finalTax, prepaid, diff };
}

  const myNote = myEmployeeRecord
    ? `<div class="hint" style="background:#EAF6EE;color:#1e7a46;">✅ ③ 탭에서 완료한 <b>나의 연말정산 데이터(${myEmployeeRecord.name} · ${myEmployeeRecord.dept})</b>가 이번 자동화에 함께 포함됩니다.</div>`
    : `<div class="hint" style="background:#FBEAEA;color:#B3261E;">⚠️ 아직 ③ 탭에서 나의 연말정산을 완료하지 않았습니다. 지금 실행해도 예시 ${EMPLOYEE_BATCH.length}명 데이터로 체험할 수 있지만, ③ 탭을 먼저 완료하면 내 데이터도 함께 분석에 포함됩니다.</div>`;
  el.innerHTML = `
  <div class="card">
    <h2>⑥ RPA 자동화 실습 — 신입사원 ${total}명 일괄 처리</h2>
    <div class="hint">💡 실제 인사팀에서는 수십~수백 명의 연말정산을 사람이 한 명씩 처리하기 어렵습니다. RPA(로봇 프로세스 자동화)가 반복 업무를 대신 처리해요. ③ 탭에서 직접 해봤던 절차를, 이번엔 로봇이 여러 명에게 동시에 수행하는 것을 지켜보세요.</div>
    ${myNote}
    <div class="rpa-flow" id="rpaFlow">
      ${RPA_STEPS.map((s,i)=>`<div class="rpa-step-chip" id="rpaChip${i}"><div class="n">${i+1}</div>${s}</div>`).join('')}
    </div>
    <div class="progress-bar"><div class="fill" id="rpaProgress"></div></div>
    <div id="rpaConsole"><span class="line-dim">[실행] 버튼을 누르면 자동화 로그가 여기에 표시됩니다...</span></div>
    <button class="btn-primary" id="rpaRunBtn" onclick="runRpa()">🤖 자동화 실행</button>
    <div id="rpaResultWrap"></div>
  </div>`;
}

function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }

async function runRpa(){
  if(rpaRunning) return;
  rpaRunning = true;
  rpaResults = [];
  const btn = document.getElementById('rpaRunBtn');
  btn.disabled = true; btn.textContent = '실행 중...';
  const consoleEl = document.getElementById('rpaConsole');
  consoleEl.innerHTML = '';
  document.getElementById('rpaResultWrap').innerHTML = '';

  const log = (text, dim=false) => {
    const line = document.createElement('div');
    if(dim) line.className='line-dim';
    line.textContent = text;
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };
  const setProgress = (pct) => { document.getElementById('rpaProgress').style.width = pct+'%'; };
  const setChipRunning = (i) => {
    document.querySelectorAll('.rpa-step-chip').forEach(c=>c.classList.remove('running'));
    document.getElementById('rpaChip'+i).classList.add('running');
  };
  const setChipDone = (i) => {
    document.getElementById('rpaChip'+i).classList.remove('running');
    document.getElementById('rpaChip'+i).classList.add('done');
  };

  const batchList = myEmployeeRecord ? [{ ...myEmployeeRecord, isMe:true }, ...EMPLOYEE_BATCH] : EMPLOYEE_BATCH;

  setChipRunning(0);
  log(`[STEP 1] 인사관리 시스템에서 대상자 명단 조회 중...`);
  await sleep(500);
  log(`  → 총 ${batchList.length}명 대상자 확인 완료${myEmployeeRecord?' (나의 데이터 포함)':''}`, true);
  setChipDone(0);
  setProgress(10);

  for(let i=0;i<batchList.length;i++){
    const emp = batchList[i];
    setChipRunning(1);
    log(`[STEP 2] ${emp.name}${emp.isMe?' (나)':''}(${emp.empNo}) 홈택스 간소화자료 자동조회...`);
    await sleep(200);
    setChipRunning(2);
    log(`[STEP 3] ${emp.name} ERP 급여정보 자동매칭 (총급여 ${emp.salary.toLocaleString()}원)`, true);
    await sleep(160);
    setChipRunning(3);
    const result = calcYearEndTax(emp);
    rpaResults.push({ ...emp, ...result });
    log(`[STEP 4] ${emp.name} 세액 자동계산 완료 → ${result.diff>=0?'환급':'추가납부'} ${Math.abs(result.diff).toLocaleString()}원`);
    await sleep(140);
    setProgress(10 + Math.round(((i+1)/batchList.length)*80));
  }

  setChipRunning(4);
  log(`[STEP 5] 전체 결과 리포트 생성 중...`);
  await sleep(400);
  setChipDone(4);
  setProgress(100);
  log(`✅ 자동화 완료! ${batchList.length}명 처리를 사람이 하나씩 했다면 훨씬 오래 걸렸을 작업을 몇 초 만에 끝냈습니다.`);

  renderRpaResultTable();
  saveProgress('rpa', { processed: EMPLOYEE_BATCH.length });
  btn.disabled = false; btn.textContent = '🔁 다시 실행';
  rpaRunning = false;
}

function renderRpaResultTable(){
  const wrap = document.getElementById('rpaResultWrap');
  wrap.innerHTML = `
    <h3 style="margin-top:18px;">처리 결과 (${rpaResults.length}명)</h3>
    <table class="batch-table">
      <tr><th>사번</th><th>이름</th><th>부서</th><th>총급여</th><th>결정세액</th><th>환급/추가납부</th></tr>
      ${rpaResults.map(r=>`<tr ${r.isMe?'style="background:var(--gold-light);"':''}>
        <td>${r.empNo}</td><td>${r.name}${r.isMe?' <span class="badge done">나</span>':''}</td><td>${r.dept}</td>
        <td>${r.salary.toLocaleString()}원</td><td>${r.finalTax.toLocaleString()}원</td>
        <td style="color:${r.diff>=0?'var(--good)':'var(--bad)'};font-weight:700;">${r.diff>=0?'환급':'추가납부'} ${Math.abs(r.diff).toLocaleString()}원</td>
      </tr>`).join('')}
    </table>
    <button class="btn-primary" style="margin-top:14px;" onclick="showTab('bi')">📊 BI 대시보드에서 분석하기 →</button>
  `;
}

let biCharts = [];
function renderBi(){
  const el = document.getElementById('tab-bi');
  if(rpaResults.length===0){
    el.innerHTML = `<div class="card">
      <h2>⑦ BI 대시보드</h2>
      <div class="hint">💡 분석할 데이터가 아직 없습니다. 먼저 ⑥ RPA 자동화를 실행해 데이터를 생성해주세요.</div>
      <button class="btn-primary" onclick="showTab('rpa')">⑥ RPA 자동화 실행하러 가기 →</button>
    </div>`;
    return;
  }

  const totalRefund = rpaResults.filter(r=>r.diff>=0).reduce((s,r)=>s+r.diff,0);
  const avgTax = Math.round(rpaResults.reduce((s,r)=>s+r.finalTax,0)/rpaResults.length);
  const refundCount = rpaResults.filter(r=>r.diff>=0).length;
  const myRow = rpaResults.find(r=>r.isMe);
  let myCompareHtml = '';
  if(myRow){
    const sameDept = rpaResults.filter(r=>r.dept===myRow.dept);
    const deptAvgDiff = Math.round(sameDept.reduce((s,r)=>s+r.diff,0)/sameDept.length);
    const cmp = myRow.diff===deptAvgDiff ? '평균과 동일해요' : (myRow.diff>deptAvgDiff ? `${myRow.dept} 평균보다 ${(myRow.diff-deptAvgDiff).toLocaleString()}원 더 유리해요` : `${myRow.dept} 평균보다 ${(deptAvgDiff-myRow.diff).toLocaleString()}원 낮아요`);
    myCompareHtml = `<div class="hint" style="background:var(--gold-light);color:#5c4a06;">
      🙋 <b>나의 결과:</b> ${myRow.diff>=0?'환급':'추가납부'} ${Math.abs(myRow.diff).toLocaleString()}원 —
      같은 ${myRow.dept} 동료 평균 대비 ${cmp}.
    </div>`;
  }

  el.innerHTML = `
  <div class="card">
    <h2>⑦ BI 대시보드 — 연말정산 결과 분석</h2>
    <div class="hint">💡 RPA가 자동으로 처리한 ${rpaResults.length}명의 데이터를 기반으로 회사 전체 현황을 한눈에 분석합니다. (실제 기업에서는 RPA가 데이터를 모으고, BI 도구가 이를 시각화·분석하는 흐름으로 이어집니다)</div>
    ${myCompareHtml}
    <div class="kpi-grid">
      <div class="kpi-card"><div class="v">${rpaResults.length}명</div><div class="l">총 처리인원</div></div>
      <div class="kpi-card"><div class="v">${refundCount}명</div><div class="l">환급 대상자</div></div>
      <div class="kpi-card"><div class="v">${totalRefund.toLocaleString()}원</div><div class="l">총 환급액</div></div>
      <div class="kpi-card"><div class="v">${avgTax.toLocaleString()}원</div><div class="l">평균 결정세액</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box"><h3>부서별 평균 환급(+)/추가납부(-)</h3><canvas id="chartDept"></canvas></div>
      <div class="chart-box"><h3>환급 vs 추가납부 인원</h3><canvas id="chartRatio"></canvas></div>
    </div>
    <div class="chart-box"><h3>공제 항목별 평균 지출</h3><canvas id="chartDeduction"></canvas></div>

    <div class="chart-box" style="margin-top:16px;">
      <h3>🤖 생성형 ERP 코파일럿에게 물어보기</h3>
      <div class="hint">💡 지금 화면의 데이터를 근거로 실시간 AI가 답변합니다. 예: "환급 가장 많은 사람은?" · "회계부 평균은?" · "추가납부 대상자 몇 명이야?" · "전체 명단 보여줘" (AI 서버 연결 전이거나 오류 시 기본 응답으로 자동 전환됩니다)</div>
      <div id="biChatBox" style="height:220px;overflow-y:auto;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#FAFBFD;margin-bottom:10px;"></div>
      <div class="chat-input-row">
        <input id="biChatInput" type="text" placeholder="데이터에 대해 물어보세요" onkeydown="if(event.key==='Enter')sendBiChat()">
        <button onclick="sendBiChat()">보내기</button>
      </div>
    </div>
  </div>`;

  drawBiCharts();
  initBiChat();
}

/* ---- 생성형 ERP 코파일럿 (BI 데이터 질의 챗봇, 규칙 기반으로 정확한 수치 응답) ---- */
let biChatHistory = [];
function initBiChat(){
  const box = document.getElementById('biChatBox');
  if(!box) return;
  box.innerHTML = '';
  biChatHistory = [];
  addBiChatMsg('bot', `안녕하세요! 지금 로드된 ${rpaResults.length}명의 연말정산 데이터에 대해 무엇이든 물어보세요.`);
}
function addBiChatMsg(role, text){
  const box = document.getElementById('biChatBox');
  if(!box) return;
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// rpaResults를 프롬프트에 그대로 넣어, AI가 실제 데이터에 근거해서만 답하도록 강제
function buildBiSystemPrompt(){
  const rows = rpaResults.map(r =>
    `${r.name} | ${r.dept} | 총급여 ${r.salary.toLocaleString()}원 | 결정세액 ${r.finalTax.toLocaleString()}원 | ${r.diff>=0?'환급':'추가납부'} ${Math.abs(r.diff).toLocaleString()}원${r.isMe?' (로그인한 학생 본인)':''}`
  ).join('\n');
  return `너는 특성화고 상업과 수업에서 사용하는 생성형 ERP의 'BI 코파일럿'이다. 아래는 방금 RPA로 일괄 처리된 연말정산 결과 데이터다.

[데이터: 이름 | 부서 | 총급여 | 결정세액 | 환급/추가납부 금액]
${rows}

답변 규칙:
1) 반드시 위 데이터에 근거해서만 답한다. 평균·합계·최댓값 등은 정확히 계산해서 제시한다.
2) 데이터에 없는 내용을 질문받으면 "제공된 데이터에는 없는 정보예요"라고 답한다.
3) 금액은 항상 천 단위 콤마와 '원'을 붙여 표기한다.
4) 답변은 2~4문장 이내로 간결하게, 고등학생이 이해하기 쉬운 말투로 답한다.
5) 개인정보를 추측하거나 지어내지 않는다.`;
}

async function sendBiChat(){
  const input = document.getElementById('biChatInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  addBiChatMsg('user', text);
  biChatHistory.push({role:'user', content:text});
  addBiChatMsg('bot', '생각 중...');
  const box = document.getElementById('biChatBox');
  const thinkingEl = box.lastChild;

  try{
    const res = await fetch(CHAT_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        system: buildBiSystemPrompt(),
        messages: biChatHistory.slice(-6),
        student: CURRENT
      })
    });
    const data = await res.json();
    if(!data.reply) throw new Error('empty reply');
    thinkingEl.textContent = data.reply;
    biChatHistory.push({role:'assistant', content:data.reply});
  }catch(e){
    // CHAT_ENDPOINT 미설정이거나 네트워크 오류 시 규칙 기반 응답으로 자동 대체
    const reply = answerBiQuery(text);
    thinkingEl.textContent = reply;
    biChatHistory.push({role:'assistant', content:reply});
    console.warn('BI 코파일럿 API 연결 실패, 규칙 기반 응답으로 대체:', e);
  }
}

function answerBiQuery(text){
  if(rpaResults.length===0) return '아직 분석할 데이터가 없어요. 먼저 ⑥ RPA 자동화를 실행해주세요.';
  const fmt = n => Math.abs(Math.round(n)).toLocaleString()+'원';

  const deptHit = DEPTS.find(d=>text.includes(d));
  if(deptHit && (text.includes('평균')||text.includes('부서'))){
    const rows = rpaResults.filter(r=>r.dept===deptHit);
    if(rows.length===0) return `${deptHit} 데이터가 없어요.`;
    const avgDiff = rows.reduce((s,r)=>s+r.diff,0)/rows.length;
    const avgTax = Math.round(rows.reduce((s,r)=>s+r.finalTax,0)/rows.length);
    return `${deptHit} 평균: 결정세액 ${avgTax.toLocaleString()}원, ${avgDiff>=0?'환급':'추가납부'} 평균 ${fmt(avgDiff)} (${rows.length}명 기준)`;
  }
  if(text.includes('환급') && (text.includes('많')||text.includes('큰')||text.includes('최고')||text.includes('가장'))){
    const top = [...rpaResults].filter(r=>r.diff>=0).sort((a,b)=>b.diff-a.diff)[0];
    if(!top) return '환급 대상자가 없어요.';
    return `환급이 가장 많은 사람은 ${top.name}(${top.dept})님으로, ${fmt(top.diff)} 환급받아요.`;
  }
  if(text.includes('추가납부') && (text.includes('많')||text.includes('큰')||text.includes('최고')||text.includes('가장'))){
    const top = [...rpaResults].filter(r=>r.diff<0).sort((a,b)=>a.diff-b.diff)[0];
    if(!top) return '추가납부 대상자가 없어요.';
    return `추가납부가 가장 많은 사람은 ${top.name}(${top.dept})님으로, ${fmt(top.diff)} 추가로 내야 해요.`;
  }
  if(text.includes('환급') && (text.includes('몇')||text.includes('인원')||text.includes('명'))){
    return `환급 대상자는 총 ${rpaResults.filter(r=>r.diff>=0).length}명이에요.`;
  }
  if(text.includes('추가납부') && (text.includes('몇')||text.includes('인원')||text.includes('명'))){
    return `추가납부 대상자는 총 ${rpaResults.filter(r=>r.diff<0).length}명이에요.`;
  }
  if(text.includes('총') && text.includes('환급')){
    const total = rpaResults.filter(r=>r.diff>=0).reduce((s,r)=>s+r.diff,0);
    return `전체 환급액 합계는 ${fmt(total)}이에요.`;
  }
  if(text.includes('명단')||text.includes('리스트')||text.includes('목록')){
    return '전체 명단: ' + rpaResults.map(r=>`${r.name}(${r.dept}) ${r.diff>=0?'환급':'추가납부'} ${fmt(r.diff)}`).join(', ');
  }
  if(text.includes('실행')||text.includes('자동화')){
    return '자동화 실행은 ⑥ RPA 자동화 탭에서 할 수 있어요. 거기서 "🤖 자동화 실행" 버튼을 눌러보세요.';
  }
  return '아직 이해하지 못한 질문이에요. 예를 들어 "환급 가장 많은 사람은?", "회계부 평균은?", "추가납부 인원 몇 명?"처럼 물어봐 주세요.';
}

function drawBiCharts(){
  if(typeof Chart === 'undefined'){
    ['chartDept','chartRatio','chartDeduction'].forEach(id=>{
      const c = document.getElementById(id);
      if(c && c.parentElement) c.parentElement.innerHTML =
        '<p style="color:var(--bad);font-size:12.5px;">⚠️ 차트 라이브러리(Chart.js)를 불러오지 못했습니다. 인터넷 연결 상태 또는 CDN 차단 여부를 확인해주세요.</p>';
    });
    return;
  }
  biCharts.forEach(c=>{ try{ c.destroy(); }catch(e){ /* 이미 제거된 캔버스는 무시 */ } });
  biCharts = [];

  const depts = [...new Set(rpaResults.map(r=>r.dept))];
  const deptAvg = depts.map(d=>{
    const rows = rpaResults.filter(r=>r.dept===d);
    return Math.round(rows.reduce((s,r)=>s+r.diff,0)/rows.length);
  });
  biCharts.push(new Chart(document.getElementById('chartDept'), {
    type:'bar',
    data:{ labels:depts, datasets:[{ label:'평균 환급(+)/추가납부(-)', data:deptAvg,
      backgroundColor: deptAvg.map(v=>v>=0?'#1E7A46':'#B3261E') }] },
    options:{ responsive:true, plugins:{legend:{display:false}} }
  }));

  const refundCount = rpaResults.filter(r=>r.diff>=0).length;
  const payCount = rpaResults.length - refundCount;
  biCharts.push(new Chart(document.getElementById('chartRatio'), {
    type:'doughnut',
    data:{ labels:['환급 대상','추가납부 대상'], datasets:[{ data:[refundCount,payCount], backgroundColor:['#1E7A46','#B3261E'] }] },
    options:{ responsive:true }
  }));

  const avgOf = key => Math.round(rpaResults.reduce((s,r)=>s+r[key],0)/rpaResults.length);
  biCharts.push(new Chart(document.getElementById('chartDeduction'), {
    type:'bar',
    data:{ labels:['신용카드','의료비','교육비','연금저축'],
      datasets:[{ label:'평균 지출액', data:[avgOf('card'),avgOf('medical'),avgOf('edu'),avgOf('pension')], backgroundColor:'#122A52' }] },
    options:{ responsive:true, indexAxis:'y', plugins:{legend:{display:false}} }
  }));
}
</script>
