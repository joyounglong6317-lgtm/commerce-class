              "대표적 세액공제: 근로소득세액공제, 자녀세액공제, 연금계좌세액공제, 특별세액공제(보험료·의료비·교육비·기부금) 등",
              "2026년 개정으로 자녀세액공제 관련 내용이 일부 변경되었으므로 최신 개정사항을 함께 확인하는 것이 좋습니다.",
              "종합소득세 확정신고·납부기한은 다음 해 5월 1일부터 5월 31일까지입니다(성실신고확인대상자는 6월 30일까지).",
              "근로소득만 있는 자로서 연말정산으로 납세의무가 종결된 경우 원칙적으로 별도의 종합소득세 확정신고 의무가 없습니다."
            ],
            questions: [
              { question: "종합소득세 확정신고·납부기한으로 옳은 것은?", options: ["다음 해 3월 10일까지", "다음 해 5월 1일~5월 31일", "당해연도 12월 31일까지", "다음 해 7월 25일까지"], answer: 1, explanation: "종합소득세 확정신고·납부기한은 원칙적으로 다음 해 5월 1일부터 5월 31일까지입니다." },
              { question: "근로소득만 있고 연말정산을 마친 근로자의 5월 종합소득세 신고 의무는?", options: ["반드시 별도로 확정신고해야 한다.", "원칙적으로 확정신고 의무가 없다(연말정산으로 종결).", "매월 신고해야 한다.", "다음 해 3월까지 신고해야 한다."], answer: 1, explanation: "근로소득만 있는 자는 연말정산으로 납세의무가 종결되는 것이 원칙이라 별도의 확정신고 의무가 없습니다." },
              { question: "산출세액에서 세액공제·세액감면을 차감한 금액을 무엇이라 하는가?", options: ["종합소득금액", "과세표준", "결정세액", "기납부세액"], answer: 2, explanation: "산출세액에서 세액공제·세액감면을 차감하면 결정세액이 산출되고, 여기서 기납부세액을 빼면 납부(환급)할 세액이 됩니다." },
              { question: "다음 중 세액공제 항목으로 옳은 것은?", options: ["기본공제", "연금보험료공제", "자녀세액공제", "특별소득공제"], answer: 2, explanation: "자녀세액공제는 산출세액에서 직접 차감하는 세액공제 항목이며, 나머지는 소득공제 항목입니다." },
              { question: "성실신고확인대상 사업자의 종합소득세 신고기한 특례로 옳은 것은?", options: ["다음 해 4월 30일까지", "다음 해 6월 30일까지", "당해연도 12월 31일까지", "특례가 없다."], answer: 1, explanation: "성실신고확인대상 사업자는 성실신고확인서 제출과 함께 신고기한이 다음 해 6월 30일까지 연장됩니다." },
              { question: "2026년 세법 개정과 관련하여 유의할 사항으로 가장 적절한 것은?", options: ["소득세 항목은 매년 개정되지 않으므로 확인이 불필요하다.", "자녀세액공제 등 세부 항목은 매년 개정될 수 있어 최신 개정세법을 확인해야 한다.", "종합소득세 신고기한은 절대 변경되지 않는다.", "개정세법은 전산세무 시험과 무관하다."], answer: 1, explanation: "자녀세액공제 등은 매년 개정될 수 있는 항목이므로, 시험 및 실무 적용 시 최신 개정세법을 반드시 확인해야 합니다." }
            ]
          }
        ];

        const groupColors = { "부가가치세": "bg-indigo-600", "소득세": "bg-emerald-600" };
        const groupBorder = { "부가가치세": "border-indigo-500", "소득세": "border-emerald-500" };

        function App() {
          const [selectedChapter, setSelectedChapter] = useState(curriculumData[0]);
          const [quizMode, setQuizMode] = useState(false);
          const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [isSubmitted, setIsSubmitted] = useState(false);
          const [score, setScore] = useState(0);
          const [showResult, setShowResult] = useState(false);
          const [sidebarOpen, setSidebarOpen] = useState(true);

          const [userXP, setUserXP] = useState(0);
          const [userLevel, setUserLevel] = useState(1);
          const [chapterRecords, setChapterRecords] = useState({});
          const [earnedBadges, setEarnedBadges] = useState([]);
          const [showLevelUp, setShowLevelUp] = useState(false);

          // --- 자료실(Firebase) 상태 ---
          const [archiveMode, setArchiveMode] = useState(false);
          const [archiveFiles, setArchiveFiles] = useState([]);
          const [archiveLoading, setArchiveLoading] = useState(false);
          const [uploaderName, setUploaderName] = useState('');
          const [uploading, setUploading] = useState(false);
          const [uploadProgress, setUploadProgress] = useState(0);
          const [uploadError, setUploadError] = useState(null);

          useEffect(() => {
            if (!archiveMode || !firebaseReady) return;
            setArchiveLoading(true);
            const unsub = archiveDb.collection(ARCHIVE_ID + '_files')
              .orderBy('uploadedAt', 'desc')
              .onSnapshot(snap => {
                const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                setArchiveFiles(list);
                setArchiveLoading(false);
              }, err => {
                console.error('자료실 목록 로드 오류:', err);
                setArchiveLoading(false);
              });
            return () => unsub();
          }, [archiveMode]);

          const formatFileSize = (bytes) => {
            if (!bytes) return '';
            if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file || !firebaseReady) return;
            setUploading(true);
            setUploadProgress(0);
            setUploadError(null);
            const path = ARCHIVE_ID + '/' + Date.now() + '_' + file.name;
            const ref = archiveStorage.ref().child(path);
            const task = ref.put(file);
            task.on('state_changed',
              snap => setUploadProgress(Math.round((snap.bytesTransferred / snap.totalBytes) * 100)),
              err => { console.error('업로드 오류:', err); setUploadError('업로드 중 오류가 발생했어요. 다시 시도해주세요.'); setUploading(false); },
              () => {
                task.snapshot.ref.getDownloadURL().then(url => {
                  return archiveDb.collection(ARCHIVE_ID + '_files').add({
                    name: file.name,
                    url: url,
                    size: file.size,
                    storagePath: path,
                    uploader: uploaderName.trim() || '익명',
                    uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
                  });
                }).then(() => {
                  setUploading(false);
                  setUploadProgress(0);
                  e.target.value = '';
                }).catch(err => {
                  console.error('저장 오류:', err);
                  setUploadError('파일 정보를 저장하지 못했어요.');
                  setUploading(false);
                });
              }
            );
          };

          const handleFileDelete = (file) => {
            if (!firebaseReady) return;
            if (!window.confirm(`'${file.name}' 파일을 삭제할까요?`)) return;
            archiveDb.collection(ARCHIVE_ID + '_files').doc(file.id).delete().catch(err => console.error(err));
            if (file.storagePath) {
              archiveStorage.ref().child(file.storagePath).delete().catch(err => console.error(err));
            }
          };

          const addXP = (amount) => {
            setUserXP(prev => {
              const newXP = prev + amount;
              const currentLv = Math.floor(prev / 100) + 1;
              const newLevel = Math.floor(newXP / 100) + 1;
              if (newLevel > currentLv) {
                setUserLevel(newLevel);
                setShowLevelUp(true);
                setTimeout(() => setShowLevelUp(false), 3000);
              }
              return newXP;
            });
          };

          const [gameActive, setGameActive] = useState(false);
          const [gameStatus, setGameStatus] = useState('idle');
          const [gameTime, setGameTime] = useState(60);
          const [gameScore, setGameScore] = useState(0);
          const [gameCombo, setGameCombo] = useState(0);
          const [gameMaxCombo, setGameMaxCombo] = useState(0);
          const [mixedQuestions, setMixedQuestions] = useState([]);
          const [gameQIdx, setGameQIdx] = useState(0);
          const [gameFeedback, setGameFeedback] = useState(null);

          useEffect(() => {
            if (gameStatus === 'over') {
              if (gameScore >= 300 && !earnedBadges.includes('game_master')) {
                setEarnedBadges(prev => [...prev, 'game_master']);
                addXP(100);
              }
            }
          }, [gameStatus, gameScore]);

          useEffect(() => {
            let timer;
            if (gameActive && gameStatus === 'playing') {
              timer = setInterval(() => {
                setGameTime(prev => {
                  if (prev <= 1) {
                    setGameStatus('over');
                    setGameActive(false);
                    return 0;
                  }
                  return prev - 1;
                });
              }, 1000);
            }
            return () => clearInterval(timer);
          }, [gameActive, gameStatus]);

          const startGame = () => {
            const all = curriculumData.flatMap(ch => ch.questions.map(q => ({ ...q, chapterTitle: ch.title })));
            const shuffled = [...all].sort(() => Math.random() - 0.5);
            setMixedQuestions(shuffled);
            setGameQIdx(0);
            setGameScore(0);
            setGameCombo(0);
            setGameMaxCombo(0);
            setGameTime(60);
            setGameStatus('playing');
            setGameActive(true);
            setGameFeedback(null);
          };

          const answerGame = (idx) => {
            if (gameFeedback) return;
            const q = mixedQuestions[gameQIdx % mixedQuestions.length];
            const correct = idx === q.answer;
            if (correct) {
              const newCombo = gameCombo + 1;
              setGameCombo(newCombo);
              setGameMaxCombo(m => Math.max(m, newCombo));
              setGameScore(s => s + 10 + Math.min(newCombo, 5) * 2);
              setGameFeedback('correct');
            } else {
              setGameCombo(0);
              setGameFeedback('wrong');
            }
            setTimeout(() => {
              setGameFeedback(null);
              setGameQIdx(i => i + 1);
            }, 500);
          };

          const startQuiz = (chapter) => {
            setSelectedChapter(chapter);
            setQuizMode(true);
            setCurrentQuestionIdx(0);
            setSelectedOption(null);
            setIsSubmitted(false);
            setScore(0);
            setShowResult(false);
          };

          const submitAnswer = () => {
            if (selectedOption === null) return;
            setIsSubmitted(true);
            if (selectedOption === selectedChapter.questions[currentQuestionIdx].answer) {
              setScore(s => s + 1);
            }
          };

          const nextQuestion = () => {
            if (currentQuestionIdx + 1 < selectedChapter.questions.length) {
              setCurrentQuestionIdx(i => i + 1);
              setSelectedOption(null);
              setIsSubmitted(false);
            } else {
              const total = selectedChapter.questions.length;
              const finalScore = score + (selectedOption === selectedChapter.questions[currentQuestionIdx].answer && isSubmitted ? 0 : 0);
              setChapterRecords(prev => ({ ...prev, [selectedChapter.id]: Math.max(prev[selectedChapter.id] || 0, score) }));
              addXP(score * 10);
              if (score === total && !earnedBadges.includes('perfect_' + selectedChapter.id)) {
                setEarnedBadges(prev => [...prev, 'perfect_' + selectedChapter.id]);
                addXP(30);
              }
              setShowResult(true);
            }
          };

          const backToSummary = () => {
            setQuizMode(false);
            setShowResult(false);
          };

          const currentQ = selectedChapter.questions[currentQuestionIdx];
          const currentGameQ = mixedQuestions.length ? mixedQuestions[gameQIdx % mixedQuestions.length] : null;

          return (
            <div className="flex h-screen">
              {/* Sidebar */}
              <div className={`${sidebarOpen ? 'w-72' : 'w-0'} transition-all duration-200 bg-slate-900 text-slate-100 overflow-hidden flex-shrink-0 flex flex-col`}>
                <div className="p-4 border-b border-slate-700">
                  <h1 className="text-lg font-bold leading-snug">전산세무 2급<br/>세무회계 학습 프로그램</h1>
                  <p className="text-xs text-slate-400 mt-1">부가가치세 · 소득세</p>
                </div>
                <div className="p-3 border-b border-slate-700 bg-slate-800/60">
                  <div className="flex items-center justify-between text-xs mb-1">
                    <span className="font-semibold text-amber-300"><i className="fa-solid fa-star mr-1"></i>Lv.{userLevel}</span>
                    <span className="text-slate-400">{userXP % 100} / 100 XP</span>
                  </div>
                  <div className="w-full bg-slate-700 rounded-full h-2">
                    <div className="bg-amber-400 h-2 rounded-full transition-all" style={{ width: `${userXP % 100}%` }}></div>
                  </div>
                  {earnedBadges.length > 0 && (
                    <div className="flex gap-1 mt-2 flex-wrap">
                      {earnedBadges.map(b => (
                        <span key={b} className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full"><i className="fa-solid fa-medal mr-0.5"></i>뱃지</span>
                      ))}
                    </div>
                  )}
                </div>
                <div className="flex-1 overflow-y-auto p-2">
                  <a href="../index.html" className="w-full text-left mb-2 px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-600 font-bold text-sm flex items-center gap-2 no-underline text-slate-100">
                    <i className="fa-solid fa-house"></i> 메인 로그인 화면으로
                  </a>
                  <button onClick={() => { setArchiveMode(false); setQuizMode(false); startGame(); }} className="w-full text-left mb-2 px-3 py-2.5 rounded-lg bg-gradient-to-r from-rose-600 to-orange-500 font-bold text-sm flex items-center gap-2">
                    <i className="fa-solid fa-bolt"></i> 스피드 퀴즈 게임 모드
                  </button>
                  <button onClick={() => { setGameStatus('idle'); setGameActive(false); setArchiveMode(true); }} className="w-full text-left mb-3 px-3 py-2.5 rounded-lg bg-slate-700 font-bold text-sm flex items-center gap-2">
                    <i className="fa-solid fa-folder-open"></i> 자료실 (업로드·다운로드)
                  </button>
                  {['부가가치세', '소득세'].map(group => (
                    <div key={group} className="mb-2">
                      <div className="px-2 py-1 text-[11px] font-bold text-slate-400 tracking-wide">{group}</div>
                      {curriculumData.filter(ch => ch.group === group).map(ch => (
                        <button
                          key={ch.id}
                          onClick={() => { setSelectedChapter(ch); setQuizMode(false); setGameStatus('idle'); setGameActive(false); setArchiveMode(false); }}
                          className={`w-full text-left px-3 py-2 rounded-lg text-sm mb-1 flex items-center justify-between ${selectedChapter.id === ch.id && !quizMode && gameStatus === 'idle' ? 'bg-slate-700 font-bold' : 'hover:bg-slate-800'}`}
                        >
                          <span>{ch.title}</span>
                          {chapterRecords[ch.id] !== undefined && (
                            <span className="text-[10px] text-emerald-400">{chapterRecords[ch.id]}/{ch.questions.length}</span>
                          )}
                        </button>
                      ))}
                    </div>
                  ))}
                </div>
              </div>

              {/* Main */}
              <div className="flex-1 overflow-y-auto relative">
                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="fixed top-4 left-4 z-20 bg-white shadow-md rounded-full w-9 h-9 flex items-center justify-center border" style={{ left: sidebarOpen ? '292px' : '12px' }}>
                  <i className={`fa-solid ${sidebarOpen ? 'fa-angle-left' : 'fa-angle-right'}`}></i>
                </button>

                {showLevelUp && (
                  <div className="fixed top-6 right-6 z-30 bg-amber-400 text-slate-900 px-5 py-3 rounded-xl shadow-xl font-bold animate-bounce">
                    <i className="fa-solid fa-crown mr-2"></i>레벨 업! Lv.{userLevel}
                  </div>
                )}

                <div className="max-w-3xl mx-auto p-8 pt-16">

                  {archiveMode ? (
                    <div>
                      <h2 className="text-2xl font-bold mb-1"><i className="fa-solid fa-folder-open mr-2 text-slate-400"></i>자료실</h2>
                      <p className="text-sm text-slate-500 mb-5">선생님과 학생 누구나 학습자료를 올리고 내려받을 수 있어요.</p>

                      {!firebaseReady ? (
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-6 text-sm text-amber-700 leading-relaxed">
                          <i className="fa-solid fa-triangle-exclamation mr-1.5"></i>
                          자료실을 사용하려면 Firebase 설정이 필요해요. 코드 상단의 <code className="bg-amber-100 px-1 rounded">firebaseConfig</code> 값을 채워 넣으면 바로 작동합니다. (다른 학습 기능은 지금도 정상적으로 사용할 수 있어요.)
                        </div>
                      ) : (
                        <div>
                          <div className="bg-white border rounded-xl p-5 shadow-sm mb-5">
                            <label className="block text-xs font-bold text-slate-500 mb-1.5">올리는 사람 이름 (선택)</label>
                            <input
                              type="text"
                              value={uploaderName}
                              onChange={(e) => setUploaderName(e.target.value)}
                              placeholder="예: 2학년 3반 김상업"
                              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3"
                            />
                            <label className="block w-full text-center border-2 border-dashed border-slate-300 rounded-lg py-6 text-sm text-slate-500 cursor-pointer hover:bg-slate-50">
                              <i className="fa-solid fa-cloud-arrow-up text-xl mb-1 block"></i>
                              클릭해서 파일 선택
                              <input type="file" onChange={handleFileUpload} className="hidden" disabled={uploading} />
                            </label>
                            {uploading && (
                              <div className="mt-3">
                                <div className="w-full bg-slate-200 rounded-full h-2">
                                  <div className="bg-slate-700 h-2 rounded-full transition-all" style={{ width: `${uploadProgress}%` }}></div>
                                </div>
                                <p className="text-xs text-slate-400 mt-1">업로드 중... {uploadProgress}%</p>
                              </div>
                            )}
                            {uploadError && <p className="text-xs text-rose-500 mt-2">{uploadError}</p>}
                          </div>

                          <div className="bg-white border rounded-xl shadow-sm divide-y">
                            {archiveLoading ? (
                              <p className="text-sm text-slate-400 p-5 text-center">불러오는 중...</p>
                            ) : archiveFiles.length === 0 ? (
                              <p className="text-sm text-slate-400 p-5 text-center">아직 올라온 자료가 없어요.</p>
                            ) : (
                              archiveFiles.map(f => (
                                <div key={f.id} className="flex items-center justify-between px-4 py-3 gap-3">
                                  <div className="min-w-0">
                                    <p className="text-sm font-semibold text-slate-800 truncate">{f.name}</p>
                                    <p className="text-xs text-slate-400">{f.uploader} · {formatFileSize(f.size)}</p>
                                  </div>
                                  <div className="flex items-center gap-2 flex-shrink-0">
                                    <a href={f.url} target="_blank" rel="noreferrer" className="text-xs font-bold bg-slate-800 text-white px-3 py-1.5 rounded-lg">
                                      <i className="fa-solid fa-download mr-1"></i>받기
                                    </a>
                                    <button onClick={() => handleFileDelete(f)} className="text-xs text-slate-400 hover:text-rose-500 px-2 py-1.5">
                                      <i className="fa-solid fa-trash"></i>
                                    </button>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  ) : gameActive || gameStatus === 'over' || gameStatus === 'playing' ? (
                    <div>
                      {gameStatus === 'playing' && currentGameQ && (
                        <div>
                          <div className="flex items-center justify-between mb-4">
                            <div className="text-sm font-bold text-rose-600"><i className="fa-solid fa-bolt mr-1"></i>스피드 퀴즈</div>
                            <div className="flex gap-4 text-sm font-bold">
                              <span>⏱ {gameTime}초</span>
                              <span>점수 {gameScore}</span>
                              <span className="text-orange-500">콤보 x{gameCombo}</span>
                            </div>
                          </div>
                          <div className="bg-white border rounded-xl p-6 shadow-sm">
                            <p className="text-xs text-slate-400 mb-1">{currentGameQ.chapterTitle}</p>
                            <p className="font-bold text-lg mb-4">{currentGameQ.question}</p>
                            <div className="grid grid-cols-1 gap-2">
                              {currentGameQ.options.map((opt, idx) => (
                                <button key={idx} onClick={() => answerGame(idx)}
                                  className={`text-left px-4 py-3 rounded-lg border text-sm transition-colors ${gameFeedback && idx === currentGameQ.answer ? 'bg-emerald-100 border-emerald-400' : gameFeedback === 'wrong' ? 'border-slate-200' : 'border-slate-200 hover:bg-slate-50'}`}>
                                  {opt}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                      {gameStatus === 'over' && (
                        <div className="text-center bg-white border rounded-xl p-10 shadow-sm">
                          <i className="fa-solid fa-flag-checkered text-4xl text-orange-500 mb-3"></i>
                          <h2 className="text-2xl font-bold mb-2">게임 종료!</h2>
                          <p className="text-slate-500 mb-1">최종 점수 <span className="font-bold text-slate-900">{gameScore}</span></p>
                          <p className="text-slate-500 mb-6">최고 콤보 <span className="font-bold text-slate-900">x{gameMaxCombo}</span></p>
                          <div className="flex gap-3 justify-center">
                            <button onClick={startGame} className="px-5 py-2.5 rounded-lg bg-rose-600 text-white font-bold text-sm">다시 도전</button>
                            <button onClick={() => setGameStatus('idle')} className="px-5 py-2.5 rounded-lg bg-slate-200 text-slate-700 font-bold text-sm">단원 학습으로</button>
                          </div>
                        </div>
                      )}
                    </div>
                  ) : !quizMode ? (
                    <div>
                      <span className={`inline-block text-[11px] font-bold text-white px-2.5 py-1 rounded-full mb-3 ${groupColors[selectedChapter.group]}`}>{selectedChapter.group}</span>
                      <h2 className="text-2xl font-bold mb-5">{selectedChapter.title}</h2>
                      <div className="bg-white border rounded-xl p-6 shadow-sm mb-6">
                        <h3 className="font-bold text-slate-700 mb-3 text-sm"><i className="fa-solid fa-book-open mr-1.5 text-slate-400"></i>핵심 개념 요약</h3>
                        <ul className="space-y-2.5">
                          {selectedChapter.summary.map((s, i) => (
                            <li key={i} className="text-sm text-slate-600 flex gap-2 leading-relaxed">
                              <span className="text-slate-300 font-bold">{i + 1}.</span>{s}
                            </li>
                          ))}
                        </ul>
                      </div>
                      <button onClick={() => startQuiz(selectedChapter)} className={`w-full py-3.5 rounded-xl font-bold text-white shadow-sm ${groupColors[selectedChapter.group]}`}>
                        <i className="fa-solid fa-pen-to-square mr-2"></i>이 단원 퀴즈 풀기 ({selectedChapter.questions.length}문제)
                      </button>
                    </div>
                  ) : showResult ? (
                    <div className="text-center bg-white border rounded-xl p-10 shadow-sm">
                      <i className="fa-solid fa-trophy text-4xl text-amber-400 mb-3"></i>
                      <h2 className="text-2xl font-bold mb-2">퀴즈 완료!</h2>
                      <p className="text-slate-500 mb-1">{selectedChapter.title}</p>
                      <p className="text-3xl font-bold my-4">{score} <span className="text-slate-400 text-lg">/ {selectedChapter.questions.length}</span></p>
                      <p className="text-sm text-amber-600 font-semibold mb-6">+{score * 10} XP 획득</p>
                      <div className="flex gap-3 justify-center">
                        <button onClick={() => startQuiz(selectedChapter)} className="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-bold text-sm">다시 풀기</button>
                        <button onClick={backToSummary} className="px-5 py-2.5 rounded-lg bg-slate-200 text-slate-700 font-bold text-sm">개념 요약으로</button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <span className="text-xs font-bold text-slate-400">{currentQuestionIdx + 1} / {selectedChapter.questions.length}</span>
                        <div className="w-40 bg-slate-200 rounded-full h-1.5">
                          <div className={`h-1.5 rounded-full ${groupColors[selectedChapter.group]}`} style={{ width: `${((currentQuestionIdx + 1) / selectedChapter.questions.length) * 100}%` }}></div>
                        </div>
                      </div>
                      <div className="bg-white border rounded-xl p-6 shadow-sm">
                        <p className="font-bold text-lg mb-5">{currentQ.question}</p>
                        <div className="space-y-2.5">
                          {currentQ.options.map((opt, idx) => {
                            let cls = 'border-slate-200 hover:bg-slate-50';
                            if (isSubmitted) {
                              if (idx === currentQ.answer) cls = 'bg-emerald-100 border-emerald-400';
                              else if (idx === selectedOption) cls = 'bg-rose-100 border-rose-400';
                            } else if (idx === selectedOption) {
                              cls = `border-2 ${groupBorder[selectedChapter.group]} bg-slate-50`;
                            }
                            return (
                              <button key={idx} disabled={isSubmitted} onClick={() => setSelectedOption(idx)}
                                className={`w-full text-left px-4 py-3 rounded-lg border text-sm transition-colors ${cls}`}>
                                {opt}
                              </button>
                            );
                          })}
                        </div>
                        {isSubmitted && (
                          <div className="mt-4 p-4 bg-slate-50 rounded-lg text-sm text-slate-600 leading-relaxed">
                            <i className="fa-solid fa-circle-info mr-1.5 text-slate-400"></i>{currentQ.explanation}
                          </div>
                        )}
                        <div className="mt-5 flex justify-end">
                          {!isSubmitted ? (
                            <button onClick={submitAnswer} disabled={selectedOption === null} className={`px-6 py-2.5 rounded-lg font-bold text-white text-sm disabled:opacity-40 ${groupColors[selectedChapter.group]}`}>제출하기</button>
                          ) : (
                            <button onClick={nextQuestion} className="px-6 py-2.5 rounded-lg font-bold text-white text-sm bg-slate-800">
                              {currentQuestionIdx + 1 < selectedChapter.questions.length ? '다음 문제' : '결과 보기'}
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
