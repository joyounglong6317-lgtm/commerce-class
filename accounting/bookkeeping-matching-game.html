<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회계 짝맞추기 : 거래와 분개 카드 게임</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Gowun+Dodum&family=Roboto+Mono:wght@500;700&display=swap');
:root{
  --bg-a:#FFE3EC; --bg-b:#E9DFFB; --bg-c:#FFF3E4;
  --pink:#FF7CA3; --pink-deep:#E5477B; --pink-soft:#FFD9E6;
  --lav:#9C7FE0; --lav-deep:#7C5CD1; --lav-soft:#E7DEFB;
  --mint:#4FBE93; --peach:#FF9E80;
  --ink:#5B4B66; --sub:#9A8CA8;
  --card:#FFFCFA; --line:#F6DCE9;
  --ok:#2FA47B; --bad:#E5477B; --back:#B98FE8;
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'Gowun Dodum',sans-serif;color:var(--ink);min-height:100vh;padding:24px 12px 60px;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,182,213,.5), transparent 40%),
    radial-gradient(circle at 90% 20%, rgba(197,168,242,.5), transparent 42%),
    linear-gradient(160deg, var(--bg-a), var(--bg-b) 55%, var(--bg-c));
  background-attachment:fixed;
}
.wrap{max-width:920px;margin:0 auto;}
.header{
  background:linear-gradient(120deg, var(--lav), var(--pink) 100%);
  border-radius:26px;padding:20px 26px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 10px 26px rgba(180,140,220,.3);
}
.header::after{content:"🍬";position:absolute;right:20px;top:12px;font-size:40px;opacity:.5;}
.eyebrow{font-family:'Baloo 2';font-size:12px;letter-spacing:2px;font-weight:700;margin-bottom:6px;opacity:.95;}
h1{font-family:'Baloo 2';font-weight:800;font-size:22px;margin:0 0 4px;}
.header p{margin:0;font-size:12.5px;opacity:.95;line-height:1.6;}

.setup-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.pill-group{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:4px;}
.pill{font-family:'Baloo 2';font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:16px;cursor:pointer;color:var(--sub);}
.pill.active{background:linear-gradient(120deg,var(--pink),var(--lav));color:#fff;}
.icon-btn{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;font-family:'Baloo 2';font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink);}
.icon-btn.active{background:var(--pink-soft);border-color:var(--pink);}

.status-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.chip{flex:1;min-width:110px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--line);}
.chip .lbl{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:1px;font-family:'Baloo 2';}
.chip .val{font-family:'Roboto Mono';font-size:17px;font-weight:700;color:var(--pink-deep);}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.board.big{grid-template-columns:repeat(4,1fr);}
@media (max-width:560px){.board{grid-template-columns:repeat(2,1fr);}}
.tile{position:relative;aspect-ratio:4/3;perspective:800px;cursor:pointer;}
.tile-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;}
.tile.flipped .tile-inner, .tile.matched .tile-inner{transform:rotateY(180deg);}
.tile-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12.5px;line-height:1.4;}
.tile-back{background:linear-gradient(150deg,var(--back),var(--lav-deep));border:2px solid #fff;color:#fff;font-family:'Baloo 2';font-size:26px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.08);}
.tile-front{background:#fff;border:2px solid var(--line);transform:rotateY(180deg);color:var(--ink);font-weight:500;}
.tile.matched .tile-front{background:rgba(79,190,147,0.14);border-color:var(--ok);color:var(--ok);font-weight:700;}
.tile.wrongflash .tile-front{background:rgba(229,71,123,0.1);border-color:var(--bad);}

.controls{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap;}
button{font-family:'Baloo 2';font-weight:700;font-size:14px;border-radius:16px;padding:11px 22px;cursor:pointer;border:none;transition:transform .1s;}
button:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(120deg,var(--pink),var(--pink-deep));color:#fff;box-shadow:0 5px 0 #C43567;}
.btn-ghost{background:var(--card);color:var(--pink-deep);border:1.8px solid var(--pink-soft);}

.win-overlay{display:none;text-align:center;background:var(--card);border:2px solid var(--pink-soft);border-radius:22px;padding:28px;margin-top:18px;}
.win-overlay.show{display:block;}
.win-overlay .big{font-family:'Baloo 2';font-weight:800;font-size:28px;color:var(--pink-deep);}
.stars{font-size:34px;margin:10px 0;letter-spacing:6px;}
.best-line{font-size:12.5px;color:var(--sub);margin-top:6px;font-family:'Roboto Mono';}
</style>
</head>
<body><div style="position:fixed;top:10px;left:10px;z-index:99999;display:flex;gap:6px;font-family:'Baloo 2',sans-serif;"><a href="hub.html" style="background:linear-gradient(120deg,#9C7FE0,#FF7CA3);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;white-space:nowrap;">← 뒤로가기</a><a href="../index.html" style="background:linear-gradient(120deg,#9C7FE0,#FF7CA3);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;white-space:nowrap;">🏠 메인화면</a></div>

<div class="wrap">
  <div class="header">
    <div class="eyebrow">회계원리 · 짝맞추기 게임</div>
    <h1>거래 카드 & 분개 카드 짝맞추기</h1>
    <p>같은 거래에 해당하는 '거래 상황' 카드와 '정답 분개' 카드를 찾아 짝을 맞춰보세요. 난이도를 골라 도전하고 별점을 모아보세요!</p>
  </div>

  <div class="setup-row">
    <div class="pill-group" id="diffGroup">
      <div class="pill" data-n="6">쉬움 (6쌍)</div>
      <div class="pill" data-n="10">보통 (10쌍)</div>
      <div class="pill" data-n="16">어려움 (16쌍)</div>
    </div>
    <div class="icon-btn" id="soundBtn">🔊 효과음 켜짐</div>
  </div>

  <div class="status-bar">
    <div class="chip"><div class="lbl">시도 횟수</div><div class="val" id="statMoves">0</div></div>
    <div class="chip"><div class="lbl">맞춘 짝</div><div class="val" id="statMatched">0 / 6</div></div>
    <div class="chip"><div class="lbl">경과 시간</div><div class="val" id="statTime">00:00</div></div>
    <div class="chip"><div class="lbl">최고 기록</div><div class="val" id="statBest">-</div></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn-ghost" id="restartBtn">🔀 다시 섞기</button>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="big">🎉 모든 짝을 맞췄어요!</div>
    <div class="stars" id="winStars"></div>
    <div style="margin-top:2px;font-family:'Roboto Mono';">시도 <span id="winMoves"></span>회 · 시간 <span id="winTime"></span></div>
    <div class="best-line" id="bestLine"></div>
    <div class="controls"><button class="btn-primary" id="playAgainBtn">한 번 더 하기</button></div>
  </div>
</div>

<script>
const ALL_PAIRS = [
  {sit:"현금 1,000,000원을 출자하여 개업하다", entry:"(차) 현금 1,000,000 / (대) 자본금 1,000,000"},
  {sit:"상품 300,000원을 현금으로 매입하다", entry:"(차) 상품 300,000 / (대) 현금 300,000"},
  {sit:"외상매출금 100,000원을 현금으로 회수하다", entry:"(차) 현금 100,000 / (대) 외상매출금 100,000"},
  {sit:"은행에서 현금 2,000,000원을 빌리다", entry:"(차) 현금 2,000,000 / (대) 단기차입금 2,000,000"},
  {sit:"이번 달 임차료 250,000원을 현금으로 지급하다", entry:"(차) 임차료 250,000 / (대) 현금 250,000"},
  {sit:"건물 임대료 100,000원을 현금으로 받다", entry:"(차) 현금 100,000 / (대) 임대료 100,000"},
  {sit:"외상매입금 150,000원을 현금으로 갚다", entry:"(차) 외상매입금 150,000 / (대) 현금 150,000"},
  {sit:"업무용 비품 500,000원을 현금으로 구입하다", entry:"(차) 비품 500,000 / (대) 현금 500,000"},
  {sit:"상품 200,000원을 외상으로 매입하다", entry:"(차) 상품 200,000 / (대) 외상매입금 200,000"},
  {sit:"거래처에 현금 500,000원을 빌려주다", entry:"(차) 단기대여금 500,000 / (대) 현금 500,000"},
  {sit:"급여 400,000원을 현금으로 지급하다", entry:"(차) 급여 400,000 / (대) 현금 400,000"},
  {sit:"단기대여금 500,000원을 현금으로 회수하다", entry:"(차) 현금 500,000 / (대) 단기대여금 500,000"},
  {sit:"통신비 60,000원을 현금으로 지급하다", entry:"(차) 통신비 60,000 / (대) 현금 60,000"},
  {sit:"단기차입금 1,000,000원을 현금으로 상환하다", entry:"(차) 단기차입금 1,000,000 / (대) 현금 1,000,000"},
  {sit:"광고선전비 200,000원을 현금으로 지급하다", entry:"(차) 광고선전비 200,000 / (대) 현금 200,000"},
  {sit:"만기가 된 받을어음 300,000원을 현금으로 회수하다", entry:"(차) 현금 300,000 / (대) 받을어음 300,000"},
];

let PAIRS = ALL_PAIRS.slice(0,6);
let cards=[], flipped=[], matchedCount=0, moves=0, timerInt=null, seconds=0, lock=false;
let soundOn = true;
let curDiff = 6;

let audioCtx;
function beep(freq, dur){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function fmtTime(s){ const m=String(Math.floor(s/60)).padStart(2,'0'); const ss=String(s%60).padStart(2,'0'); return m+":"+ss; }

function bestKey(){ return 'match_best_'+curDiff; }
function loadBest(){
  const v = localStorage.getItem(bestKey());
  document.getElementById('statBest').textContent = v ? v+'회' : '-';
  return v ? parseInt(v) : null;
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function buildBoard(){
  PAIRS = shuffleArr(ALL_PAIRS.slice()).slice(0, curDiff);
  cards = [];
  PAIRS.forEach((p,i)=>{
    cards.push({pairId:i, kind:'sit', text:p.sit});
    cards.push({pairId:i, kind:'entry', text:p.entry});
  });
  shuffleArr(cards);
  matchedCount=0; moves=0; seconds=0; flipped=[]; lock=false;
  document.getElementById('statMoves').textContent='0';
  document.getElementById('statMatched').textContent='0 / '+PAIRS.length;
  document.getElementById('statTime').textContent='00:00';
  document.getElementById('winOverlay').classList.remove('show');
  loadBest();
  if(timerInt) clearInterval(timerInt);
  timerInt = setInterval(()=>{ seconds++; document.getElementById('statTime').textContent=fmtTime(seconds); }, 1000);

  const board = document.getElementById('board');
  board.innerHTML = cards.map((c,idx)=>`
    <div class="tile" data-idx="${idx}">
      <div class="tile-inner">
        <div class="tile-face tile-back">?</div>
        <div class="tile-face tile-front">${c.text}</div>
      </div>
    </div>`).join("");
  board.querySelectorAll('.tile').forEach(t=>t.addEventListener('click', onTileClick));
}

function onTileClick(e){
  if(lock) return;
  const tile = e.currentTarget;
  const idx = parseInt(tile.dataset.idx);
  if(tile.classList.contains('flipped') || tile.classList.contains('matched')) return;
  tile.classList.add('flipped');
  beep(520,.08);
  flipped.push(tile);
  if(flipped.length===2){
    lock=true;
    moves++;
    document.getElementById('statMoves').textContent=moves;
    const [t1,t2] = flipped;
    const c1 = cards[parseInt(t1.dataset.idx)];
    const c2 = cards[parseInt(t2.dataset.idx)];
    if(c1.pairId===c2.pairId && c1.kind!==c2.kind){
      setTimeout(()=>{
        t1.classList.add('matched'); t2.classList.add('matched');
        matchedCount++;
        beep(760,.15);
        document.getElementById('statMatched').textContent = matchedCount+' / '+PAIRS.length;
        flipped=[]; lock=false;
        if(matchedCount===PAIRS.length){ showWin(); }
      }, 350);
    } else {
      t1.classList.add('wrongflash'); t2.classList.add('wrongflash');
      beep(220,.18);
      setTimeout(()=>{
        t1.classList.remove('flipped'); t2.classList.remove('flipped');
        t1.classList.remove('wrongflash'); t2.classList.remove('wrongflash');
        flipped=[]; lock=false;
      }, 850);
    }
  }
}

function starsFor(moves, n){
  const ideal = n; // 이론상 최소 시도 = 쌍의 수
  if(moves <= ideal*1.3) return 3;
  if(moves <= ideal*1.8) return 2;
  return 1;
}

function showWin(){
  clearInterval(timerInt);
  const stars = starsFor(moves, PAIRS.length);
  document.getElementById('winMoves').textContent = moves;
  document.getElementById('winTime').textContent = fmtTime(seconds);
  document.getElementById('winStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('winOverlay').classList.add('show');

  const prevBest = loadBest();
  let bestLine = '';
  if(prevBest === null || moves < prevBest){
    localStorage.setItem(bestKey(), String(moves));
    bestLine = '🏆 새로운 최고 기록이에요!';
  } else {
    bestLine = `현재 최고 기록: ${prevBest}회`;
  }
  document.getElementById('bestLine').textContent = bestLine;
  loadBest();

  if(window.ClassHub){
    window.ClassHub.logScore('짝맞추기 게임', `시도 ${moves}회 · ${fmtTime(seconds)} · ⭐${stars}`, PAIRS.length, PAIRS.length, moves);
  }
}

document.getElementById('diffGroup').querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click', ()=>{
    document.querySelectorAll('#diffGroup .pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    curDiff = parseInt(p.dataset.n);
    buildBoard();
  });
});
document.querySelector('#diffGroup .pill[data-n="6"]').classList.add('active');

document.getElementById('soundBtn').addEventListener('click', ()=>{
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
  btn.classList.toggle('active', soundOn);
});
document.getElementById('soundBtn').classList.add('active');

document.getElementById('restartBtn').addEventListener('click', buildBoard);
document.getElementById('playAgainBtn').addEventListener('click', buildBoard);

buildBoard();
</script>
<script type="module" src="../shared/class-common.js" data-role="activity" data-hub="hub.html"></script>
</body>
</html>
